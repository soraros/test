name: MasterGo review runtime
on:
  push:
    branches: ['review/mastergo-runtime-audit-20260922']
    paths: ['.github/workflows/mastergo-runtime-export.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Package installed PowerShell
        shell: bash
        run: |
          runtime=$(dirname "$(readlink -f "$(command -v pwsh)")")
          tar -czf "$RUNNER_TEMP/pwsh.tar.gz" -C "$runtime" .
      - uses: actions/upload-artifact@v4
        with:
          name: review-powershell-linux
          path: ${{ runner.temp }}/pwsh.tar.gz
          compression-level: 0
          retention-days: 1
