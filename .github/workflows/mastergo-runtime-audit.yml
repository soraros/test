name: MasterGo runtime audit

on:
  push:
    branches: ['review/mastergo-runtime-audit-20260922']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact tracked input
        shell: bash
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/mastergo-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mastergo-source-${{ matrix.os }}
          path: ${{ runner.temp }}/mastergo-source.zip
          retention-days: 7
      - name: Runtime versions
        shell: pwsh
        run: |
          node --version
          $PSVersionTable.PSVersion.ToString()
      - name: Node regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem 'plugins/mastergo-wpf-transcoder/skills/mastergo-to-wpf/scripts/tests/*.test.js' | Sort-Object Name | ForEach-Object FullName)
          & node --test @tests
          exit $LASTEXITCODE
      - name: PowerShell regressions
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          foreach ($test in @(Get-ChildItem 'plugins/mastergo-wpf-transcoder/skills/mastergo-to-wpf/scripts/tests/*.tests.ps1' | Sort-Object Name)) {
            & pwsh -NoProfile -NonInteractive -File $test.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $test.Name }
          }
          if ($failed.Count) { throw ('Failed: ' + ($failed -join ', ')) }
