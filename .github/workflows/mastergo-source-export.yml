name: MasterGo exact source export
on:
  push:
    branches: ['review/mastergo-runtime-audit-20260922']
    paths: ['.github/workflows/mastergo-source-export.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: git archive --format=zip -o "$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mastergo-source-latest
          path: ${{ runner.temp }}/source.zip
          retention-days: 1
